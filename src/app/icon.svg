<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 62 60">
  <!-- Browser tab strips are light or dark depending on the OS theme, so the
       mark carries both colourways and picks one at render time. -->
  <style>
    .ink { fill: #241e18 }
    .accent { fill: #c42b26 }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f6f1e7 }
      .accent { fill: #e5484d }
    }
  </style>
  <rect class="accent" x="22" y="22" width="32" height="14" rx="7" />
  <rect class="ink" x="22" y="43" width="46" height="14" rx="7" />
  <rect class="ink" x="22" y="64" width="58" height="14" rx="7" />
</svg>
